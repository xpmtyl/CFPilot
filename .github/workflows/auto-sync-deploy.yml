name: 季度自动同步与部署 (CFPilot)

# 每季度检测上游 xmwengxing/CFPilot 是否有更新：
#   cron: 1/4/7/10 月 1 号 00:00 UTC（北京时间 08:00）运行
#   也可在 Actions 页面手动触发（workflow_dispatch）
# 有更新则：同步 fork -> 重新构建 -> 提交产物 -> 部署到 Cloudflare Pages + Worker
on:
  schedule:
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库（含完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置上游 remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/xmwengxing/CFPilot.git
          git fetch upstream main

      - name: 检测上游是否有更新
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/main)
          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          echo "remote=$REMOTE" >> $GITHUB_OUTPUT
          # 关键：用「祖先关系」判断，而非字符串相等。
          # fork 会自带 workflow 等提交，HEAD 永远不等于 upstream/main，
          # 若用 != 判断会导致每季度都误判为有更新并重复部署。
          # 若 upstream/main 已是 HEAD 的祖先 => 源没有新提交 => 跳过。
          if git merge-base --is-ancestor "$REMOTE" HEAD; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "✅ 上游无新提交（upstream 已是 HEAD 的祖先），无需更新"
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "🆕 发现上游新提交：$LOCAL -> $REMOTE"
          fi

      - name: 设置 Node.js
        if: steps.check.outputs.has_update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 同步 + 构建 + 提交 + 部署
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCT: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/auto-sync-deploy.mjs

      - name: 汇总
        if: always()
        run: echo "季度检测完成（has_update=${{ steps.check.outputs.has_update }}）"
