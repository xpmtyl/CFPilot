name: 重建并部署 CFPilot 到 Cloudflare

# 手动触发：重建单实例 CFPilot（1 个 KV + 控制面/数据面 2 个 Pages）并部署最新代码
# 知识库建议同账号只跑一个实例，避免多实例维护成本
# 敏感配置全部来自 GitHub Secrets
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-deploy
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build -w @cfpilot/worker-core

      - name: 重建并部署到 Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CFP_PW_B: ${{ secrets.CFP_PW_B }}
          CFP_UUID_B: ${{ secrets.CFP_UUID_B }}
          CFP_TROJAN_B: ${{ secrets.CFP_TROJAN_B }}
        run: node scripts/rebuild-deploy.mjs
